name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Top-level permissions: grants GITHUB_TOKEN the rights it needs across
# every job. Without these, publish fails with `name invalid` (because
# the token doesn't have packages: write, so the push is rejected).
# Also restricts other scopes so a leaked token can't be repurposed.
permissions:
  contents: read
  packages: write

# IMAGE_NAME is set in the "Set image name" step at the top of
# each job that needs it (build, publish). We can't use a GitHub
# Actions expression function to lowercase github.repository_owner
# — there is no such function — so we compute it in shell and
# write to $GITHUB_ENV. This matters for mixed-case org names
# like SaCScaffolder; Docker requires lowercase repo names.

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: ala_service_modified_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ala_service_modified_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go.sum
      - name: go mod download
        run: go mod download
      - name: go vet
        run: go vet ./...
      - name: go test (with coverage)
        run: |
          go test ./... -count=1 -race -coverprofile=coverage.out -covermode=atomic
          # Coverage gate. Adjust to taste; 80% is the default.
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: ${COVERAGE}%"
          awk -v want=80 -v got="$COVERAGE" 'BEGIN { if (got+0 < want+0) { exit 1 } }'
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: build + scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Set image name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER}/ala_service_modified" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Use ${{ env.IMAGE_NAME }} instead of $IMAGE_NAME so GitHub
          # Actions expands the env var. The bare `$VAR` form only works
          # in `run:` blocks; in `with:` values it stays literal and
          # trivy fails with "could not parse reference".
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Set image name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER}/ala_service_modified" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      # Build AND push in one job so the image is available on this runner.
      # The earlier design built in the `build` step and tried to push from a
      # separate `publish` job, but cross-runner Docker image handoff isn't
      # supported — the image doesn't exist on a fresh runner.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
